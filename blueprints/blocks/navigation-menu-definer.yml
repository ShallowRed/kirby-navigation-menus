name: shallowred.navigation-menus.block.definer.name
icon: menu
preview: fields
wysiwyg: true
fields:
  brand:
    label: shallowred.navigation-menus.field.brand.label
    type: blocks
    fieldsets:
      - text
      - image
      - site-logo
  brandLinkEnabled:
    label: shallowred.navigation-menus.field.brand-link-enabled.label
    help: shallowred.navigation-menus.field.brand-link-enabled.help
    type: toggle
    width: 1/2
  brandLink:
    when:
      brandLinkEnabled: true
    label: shallowred.navigation-menus.field.brand-link.label
    help: shallowred.navigation-menus.field.brand-link.help
    type: link
    width: 1/2
    options:
      - page
      - url
      - anchor
  brandTarget:
    when:
      brandLinkEnabled: true
    label: shallowred.navigation-menus.field.brand-target.label
    type: toggle
    width: 1/2
  items:
    label: shallowred.navigation-menus.field.nav-items.label
    type: blocks
    fieldsets:
      - nav-link
      - nav-button
      - nav-dropdown
  ariaLabel:
    width: 1/2
    label: shallowred.navigation-menus.field.aria-label.label
    help: shallowred.navigation-menus.field.aria-label.help
    type: text
  hasNavToggler:
    width: 1/2
    label: shallowred.navigation-menus.field.nav-toggler.label
    type: toggle
  id:
    width: 1/2
    label: shallowred.navigation-menus.field.id.label
    type: slug
    help: shallowred.navigation-menus.field.id.help
  breadcrumb:
    width: 1/2
    label: shallowred.navigation-menus.field.breadcrumb.label
    type: toggle
    default: false
  layout:
    width: 1/2
    label: shallowred.navigation-menus.field.layout.label
    type: select
    default: horizontal
    when:
      breadcrumb: false
    options:
      horizontal:
        "*": shallowred.navigation-menus.field.layout.horizontal
      vertical:
        "*": shallowred.navigation-menus.field.layout.vertical
