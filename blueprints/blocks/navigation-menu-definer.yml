name: shallowred.navigation-menus.block.definer.name
icon: menu
preview: fields
wysiwyg: true
fields:
  brand:
    label: shallowred.navigation-menus.field.brand.label
    type: blocks
    fieldsets:
      - text
      - image
      - site-logo
  items:
    extends: fields/nav-items
  ariaLabel:
    required: true
    width: 1/2
    label: shallowred.navigation-menus.field.aria-label.label
    help: shallowred.navigation-menus.field.aria-label.help
    type: text
    default: shallowred.navigation-menus.field.aria-label.default
  hasNavToggler:
    width: 1/2
    label: shallowred.navigation-menus.field.nav-toggler.label
    type: toggle
  id:
    width: 1/2
    label: shallowred.navigation-menus.field.id.label
    type: slug
    help: shallowred.navigation-menus.field.id.help
  breadcrumb:
    width: 1/2
    label: shallowred.navigation-menus.field.breadcrumb.label
    type: toggle
    default: false
  layout:
    width: 1/2
    label: shallowred.navigation-menus.field.layout.label
    type: select
    default: horizontal
    when:
      breadcrumb: false
    options:
      horizontal:
        "*": shallowred.navigation-menus.field.layout.horizontal
      vertical:
        "*": shallowred.navigation-menus.field.layout.vertical
