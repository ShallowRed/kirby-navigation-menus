name: shallowred.navigation-menus.block.nav-button.name
icon: circle
preview: fields
wysiwyg: true

label: "{{ label }}"

fields:
  label:
    label: shallowred.navigation-menus.nav-item.text.label
    type: text
    required: true
    width: 1/2
  target:
    label: shallowred.navigation-menus.nav-item.target.label
    type: toggle
    width: 1/2
  link:
    label: shallowred.navigation-menus.nav-item.link.label
    type: link
    required: true
    options:
      - page
      - url
      - anchor
  colorVariant:
    extends: fields/button-color-variant
    width: 1/2
  styleVariant:
    extends: fields/button-style-variant
    width: 1/2
  sizeVariant:
    extends: fields/button-size-variant
    width: 1/2
