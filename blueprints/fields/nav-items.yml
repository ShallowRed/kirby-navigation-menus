label: shallowred.navigation-menus.field.nav-items.label
type: structure
fields:
  text:
    label: shallowred.navigation-menus.nav-item.text.label
    help: shallowred.navigation-menus.nav-item.text.help
    type: text
  type:
    label: shallowred.navigation-menus.nav-item.type.label
    type: select
    options:
      link: shallowred.navigation-menus.nav-item.type.link
      button: shallowred.navigation-menus.nav-item.type.button
      dropdown: shallowred.navigation-menus.nav-item.type.dropdown
  link:
    label: shallowred.navigation-menus.nav-item.link.label
    type: link
    width: 1/2
    options:
      - page
      - url
      - anchor
  target:
    label: shallowred.navigation-menus.nav-item.target.label
    type: toggle
    width: 1/2
  variant:
    when:
      type: button
    label: shallowred.navigation-menus.nav-item.variant.label
    type: select
    options:
      default: shallowred.navigation-menus.nav-item.variant.default
      primary: shallowred.navigation-menus.nav-item.variant.primary
      secondary: shallowred.navigation-menus.nav-item.variant.secondary
      contrast: shallowred.navigation-menus.nav-item.variant.contrast
      outline: shallowred.navigation-menus.nav-item.variant.outline
    default: default
    width: 1/2
  items:
    when:
      type: dropdown
    label: shallowred.navigation-menus.nav-item.items.label
    extends: fields/nav-items
    fields:
      items: false
